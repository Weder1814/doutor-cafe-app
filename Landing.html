<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amostra Realista — Doutor Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --terra-profundo: #26190e;
    --terra-gradiente: radial-gradient(circle at 50% 40%, #4a3420 0%, #1f140b 100%);
    --texto-claro: #f5f0e8;
    --pin-bg: #fbf6ee;
    --borda-alpha: rgba(245, 240, 232, 0.2);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #110904;
    font-family: 'DM Sans', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* MOCKUP DO NAVEGADOR DO CELULAR */
  .browser-container {
    width: 100%;
    max-width: 390px;
    height: 844px;
    background: var(--terra-profundo);
    border-radius: 40px;
    border: 10px solid #22140a;
    box-shadow: 0 30px 70px rgba(0,0,0,0.8);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .system-top {
    background: #f1ebd9;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: bold;
    color: #110904;
  }
  .system-top .center-title { font-size: 15px; font-weight: 500; }

  .landing-content {
    flex: 1;
    background: var(--terra-gradiente);
    overflow-y: auto;
    color: var(--texto-claro);
    position: relative;
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 14px);
  }

  .site-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
  }
  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-icon {
    width: 16px;
    height: 16px;
    background: #d49a3b;
    border-radius: 50%;
    box-shadow: inset -4px 0 #b37d26;
  }
  .btn-waitlist {
    border: 1px solid var(--borda-alpha);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    background: transparent;
    color: var(--texto-claro);
  }

  /* PALCO DA FOLHA REALISTA */
  .leaf-stage {
    position: relative;
    width: 100%;
    height: 380px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: -10px;
  }
  
  .coffee-leaf-svg {
    width: 240px;
    height: 320px;
    filter: drop-shadow(0 20px 35px rgba(0,0,0,0.6));
  }

  /* PINS FLUTUANTES */
  .badge-pin {
    position: absolute;
    background: var(--pin-bg);
    color: #2b1d11;
    padding: 8px 14px;
    border-radius: 24px;
    font-size: 12px;
    font-weight: 500;
    box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    z-index: 10;
  }
  .badge-pin::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
  }

  .pin-ferrugem { top: 22%; left: 8px; }
  .pin-ferrugem::before { background: #b83227; }

  .pin-nutricao { top: 52%; right: 8px; }
  .pin-nutricao::before { background: #e5a93b; }

  .pin-confianca { bottom: 10%; left: 24px; }
  .pin-confianca::before { background: #2da147; }

  /* TEXTO INFERIOR */
  .hero-text-zone {
    padding: 10px 24px 40px;
  }
  .eyebrow-pill {
    display: inline-block;
    border: 1px solid var(--borda-alpha);
    padding: 6px 16px;
    border-radius: 30px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(245, 240, 232, 0.7);
    margin-bottom: 20px;
  }
  .main-heading {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1.1;
    color: var(--texto-claro);
  }
</style>
</head>
<body>

<div class="browser-container">
  <div class="system-top">
    <span>✕</span>
    <span class="center-title">landing</span>
    <div class="system-icons">•••</div>
  </div>

  <div class="landing-content">
    <nav class="site-nav">
      <div class="brand">
        <div class="brand-icon"></div>
        Doutor Café
      </div>
      <button class="btn-waitlist">Lista de espera</button>
    </nav>

    <!-- PALCO COM MODELAGEM REALISTA DA FOLHA -->
    <div class="leaf-stage">
      <svg class="coffee-leaf-svg" viewBox="0 0 240 320" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Lado Esquerdo: Sombra e profundidade -->
          <linearGradient id="ladoEsquerdo" x1="40" y1="160" x2="120" y2="160" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0f3d18"/>
            <stop offset="70%" stop-color="#1b662b"/>
            <stop offset="100%" stop-color="#227a35"/>
          </linearGradient>
          
          <!-- Lado Direito: Onde bate o brilho ceroso do café -->
          <linearGradient id="ladoDireito" x1="120" y1="160" x2="200" y2="160" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#2a8c3f"/>
            <stop offset="30%" stop-color="#349e49"/>
            <stop offset="75%" stop-color="#1e6e2f"/>
            <stop offset="100%" stop-color="#12471e"/>
          </linearGradient>

          <!-- Gradiente do Brilho de Superfície (Efeito Verniz) -->
          <linearGradient id="brilhoCera" x1="120" y1="40" x2="180" y2="260" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
            <stop offset="40%" stop-color="rgba(255,255,255,0.05)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
        </defs>

        <!-- LADO ESQUERDO DA FOLHA (Formato levemente ondulado e pontiagudo) -->
        <path d="M120 25C95 50 40 105 40 165C40 215 70 255 120 295V25Z" fill="url(#ladoEsquerdo)"/>
        
        <!-- LADO DIREITO DA FOLHA -->
        <path d="M120 25C145 50 200 105 200 165C200 215 170 255 120 295V25Z" fill="url(#ladoDireito)"/>

        <!-- CAMADA DE BRILHO ACETINADO -->
        <path d="M120 25C145 50 200 105 200 165C200 215 170 255 120 295V25Z" fill="url(#brilhoCera)"/>

        <!-- NERVURA CENTRAL (LINHA DE DIVISÃO) -->
        <path d="M120 22V296" stroke="#0a240f" stroke-width="3" stroke-linecap="round"/>
        <path d="M121 24V294" stroke="#46b35d" stroke-width="1" opacity="0.4" stroke-linecap="round"/>

        <!-- NERVURAS SECUNDÁRIAS REAIS (Curvadas organicamente para cima) -->
        <!-- Lado Esquerdo -->
        <path d="M120 75 Q95 85 70 100" stroke="#0f3d18" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
        <path d="M120 120 Q90 135 60 155" stroke="#0f3d18" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
        <path d="M120 170 Q90 185 52 210" stroke="#0f3d18" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
        <path d="M120 220 Q95 235 68 255" stroke="#0f3d18" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>

        <!-- Lado Direito (Com reflexo mais claro) -->
        <path d="M120 75 Q145 85 170 100" stroke="#52c46b" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
        <path d="M120 120 Q150 135 180 155" stroke="#52c46b" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
        <path d="M120 170 Q150 185 188 210" stroke="#52c46b" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
        <path d="M120 220 Q145 235 172 255" stroke="#52c46b" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>

        <!-- PONTOS DE DETECÇÃO DA IA (Casados com as posições dos Pins) -->
        <circle cx="92" cy="125" r="5" fill="#b83227" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.4))"/>
        <circle cx="152" cy="165" r="5" fill="#e5a93b" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.4))"/>
      </svg>

      <!-- Pins indicadores da interface -->
      <div class="badge-pin pin-ferrugem">Ferrugem detectada</div>
      <div class="badge-pin pin-nutricao">Nutrição em dia</div>
      <div class="badge-pin pin-confianca">Confiança: alta</div>
    </div>

    <div class="hero-text-zone">
      <div class="eyebrow-pill">SAFRA 2026 · EM BREVE NA PLAY STORE</div>
      <h1 class="main-heading">Sua lavoura tem um problema. Seu celular tem a resposta.</h1>
    </div>
  </div>
</div>

</body>
</html>
