<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doutor Café — Fundo Original</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --terra-profundo: #1c1107;
    /* Gradiente fiel: marrom chocolate aquecido no topo, quase preto na base */
    --terra-gradiente: linear-gradient(180deg, #3d2716 0%, #1a1008 100%);
    --texto-claro: #f5f0e8;
    --pin-bg: #fbf6ee;
    --borda-alpha: rgba(245, 240, 232, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f0a05;
    font-family: 'DM Sans', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* MOCKUP DO NAVEGADOR DO CELULAR */
  .browser-container {
    width: 100%;
    max-width: 390px;
    height: 844px;
    background: #3d2716;
    border-radius: 40px;
    border: 10px solid #1a1008;
    box-shadow: 0 30px 70px rgba(0,0,0,0.85);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .system-top {
    background: #f1ebd9;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: bold;
    color: #110904;
    z-index: 20;
  }
  .system-top .center-title { font-size: 15px; font-weight: 500; }

  /* LINHAS DIAGONAIS DO FUNDO ORIGINAL */
  .landing-content {
    flex: 1;
    background: var(--terra-gradiente);
    overflow-y: auto;
    color: var(--texto-claro);
    position: relative;
  }
  
  /* Camada isolada para as listras diagonais idênticas às do print */
  .landing-content::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: repeating-linear-gradient(
      115deg, 
      transparent, 
      transparent 18px, 
      rgba(212, 154, 59, 0.04) 18px, 
      rgba(212, 154, 59, 0.04) 20px
    );
    pointer-events: none;
    z-index: 1;
  }

  /* NAVBAR INTERNA */
  .site-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 20px;
    position: relative;
    z-index: 10;
  }
  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 21px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-icon {
    width: 18px;
    height: 18px;
    background: #d49a3b;
    border-radius: 50%;
    box-shadow: inset -5px 0 #b37d26;
  }
  .btn-waitlist {
    border: 1px solid var(--borda-alpha);
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    background: transparent;
    color: var(--texto-claro);
    font-family: 'DM Sans', sans-serif;
  }

  /* PALCO DA FOLHA */
  .leaf-stage {
    position: relative;
    width: 100%;
    height: 380px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: -5px;
    z-index: 10;
  }
  
  .coffee-leaf-svg {
    width: 250px;
    height: 330px;
    filter: drop-shadow(0 25px 45px rgba(0,0,0,0.7));
  }

  /* PINS FLUTUANTES */
  .badge-pin {
    position: absolute;
    background: var(--pin-bg);
    color: #2b1d11;
    padding: 8px 14px;
    border-radius: 24px;
    font-size: 12px;
    font-weight: 500;
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    z-index: 15;
  }
  .badge-pin::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
  }

  .pin-ferrugem { top: 24%; left: 6px; }
  .pin-ferrugem::before { background: #d45d24; }

  .pin-nutricao { top: 56%; right: 6px; }
  .pin-nutricao::before { background: #e5a93b; }

  .pin-confianca { bottom: 8%; left: 24px; }
  .pin-confianca::before { background: #2da147; }

  /* TEXTO INFERIOR */
  .hero-text-zone {
    padding: 15px 24px 40px;
    position: relative;
    z-index: 10;
  }
  .eyebrow-pill {
    display: inline-block;
    border: 1px solid var(--borda-alpha);
    padding: 6px 16px;
    border-radius: 30px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(245, 240, 232, 0.7);
    margin-bottom: 22px;
  }
  .main-heading {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1.12;
    color: var(--texto-claro);
  }
</style>
</head>
<body>

<div class="browser-container">
  <div class="system-top">
    <span>✕</span>
    <span class="center-title">landing</span>
    <div class="system-icons">•••</div>
  </div>

  <div class="landing-content">
    <nav class="site-nav">
      <div class="brand">
        <div class="brand-icon"></div>
        Doutor Café
      </div>
      <button class="btn-waitlist">Lista de espera</button>
    </nav>

    <div class="leaf-stage">
      <svg class="coffee-leaf-svg" viewBox="0 0 240 320" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="limboEsq" x1="35" y1="160" x2="120" y2="160" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0b2910"/>
            <stop offset="50%" stop-color="#124219"/>
            <stop offset="100%" stop-color="#1b5924"/>
          </linearGradient>
          
          <linearGradient id="limboDir" x1="120" y1="160" x2="205" y2="160" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#226e2e"/>
            <stop offset="25%" stop-color="#2d8c3b"/>
            <stop offset="70%" stop-color="#1c6126"/>
            <stop offset="100%" stop-color="#0c2d12"/>
          </linearGradient>

          <linearGradient id="brilhoCuticula" x1="120" y1="30" x2="190" y2="280" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
            <stop offset="35%" stop-color="rgba(255,255,255,0.06)"/>
            <stop offset="70%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>

          <radialGradient id="lesaoFerrugem" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#4a1805"/>
            <stop offset="35%" stop-color="#9c3a0c"/>
            <stop offset="65%" stop-color="#d4671a"/>
            <stop offset="90%" stop-color="#e5ad31" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#e5ad31" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- Corpo da Folha -->
        <path d="M120 18 C112 28 92 48 74 75 C55 105 35 138 35 170 C35 205 52 235 76 260 C95 280 112 295 120 302V18Z" fill="url(#limboEsq)"/>
        <path d="M120 18 C128 28 148 48 166 75 C185 105 205 138 205 170 C205 205 188 235 164 260 C145 280 128 295 120 302V18Z" fill="url(#limboDir)"/>
        <path d="M120 18 C128 28 148 48 166 75 C185 105 205 138 205 170 C205 205 188 235 164 260 C145 280 128 295 120 302V18Z" fill="url(#brilhoCuticula)"/>

        <!-- Nervuras -->
        <path d="M120 15V305" stroke="#051708" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M120.5 16V303" stroke="#5cb36f" stroke-width="1" opacity="0.5"/>

        <path d="M120 65 Q90 75 68 95" stroke="#061a0a" stroke-width="2" fill="none" opacity="0.9"/>
        <path d="M120 105 Q85 118 56 142" stroke="#061a0a" stroke-width="2" fill="none" opacity="0.9"/>
        <path d="M120 150 Q82 165 46 195" stroke="#061a0a" stroke-width="2" fill="none" opacity="0.9"/>
        <path d="M120 195 Q85 212 48 244" stroke="#061a0a" stroke-width="2" fill="none" opacity="0.9"/>
        <path d="M120 240 Q92 255 65 282" stroke="#061a0a" stroke-width="1.5" fill="none" opacity="0.9"/>

        <path d="M120 65 Q150 75 172 95" stroke="#4fa860" stroke-width="1.5" fill="none" opacity="0.4"/>
        <path d="M120 105 Q155 118 184 142" stroke="#4fa860" stroke-width="1.5" fill="none" opacity="0.4"/>
        <path d="M120 150 Q158 165 194 195" stroke="#4fa860" stroke-width="1.5" fill="none" opacity="0.4"/>
        <path d="M120 195 Q155 212 192 244" stroke="#4fa860" stroke-width="1.5" fill="none" opacity="0.4"/>
        <path d="M120 240 Q148 255 175 282" stroke="#4fa860" stroke-width="1" fill="none" opacity="0.4"/>

        <!-- Lesões de Ferrugem -->
        <circle cx="88" cy="132" r="14" fill="url(#lesaoFerrugem)"/>
        <circle cx="86" cy="130" r="4" fill="#301003" opacity="0.7"/> 
        <circle cx="74" cy="185" r="8" fill="url(#lesaoFerrugem)" opacity="0.8"/>
        <circle cx="156" cy="178" r="5" fill="#f0be42" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.3))"/>
        <circle cx="156" cy="178" r="2" fill="#ffffff" opacity="0.6"/>
      </svg>

      <!-- Pins da Interface -->
      <div class="badge-pin pin-ferrugem">Ferrugem detectada</div>
      <div class="badge-pin pin-nutricao">Nutrição em dia</div>
      <div class="badge-pin pin-confianca">Confiança: alta</div>
    </div>

    <div class="hero-text-zone">
      <div class="eyebrow-pill">SAFRA 2026 · EM BREVE NA PLAY STORE</div>
      <h1 class="main-heading">Sua lavoura tem um problema. Seu celular tem a resposta.</h1>
    </div>
  </div>
</div>

</body>
</html>
